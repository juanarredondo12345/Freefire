name: Android Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create Gradle Wrapper Files
        run: |
          mkdir -p gradle/wrapper
          # Descargar el wrapper jar
          curl -L "https://raw.githubusercontent.com/gradle/gradle/master/subprojects/installer/src/main/resources/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          # Crear propiedades
          echo "distributionBase=GRADLE_USER_HOME" > gradle.properties
          echo "distributionPath=wrapper/dists" >> gradle.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle.properties
          echo "zipStorePath=wrapper/dists" >> gradle.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle.properties
          # Crear script gradlew
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -Xmx64m -Xms64m -Dorg.gradle.appname=gradlew -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace
