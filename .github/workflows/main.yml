name: Android Build & APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Obtener el código
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. Configurar Java
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 3. Dar permisos al wrapper de gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      # 4. Construir la APK y guardar logs si falla
      - name: Build APK
        id: build_step
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1 || true
          
      # 5. Subir el LOG de error si hubo fallo (para que puedas leerlo)
      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build_log.txt

      # 6. Subir la APK si todo salió bien
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Freefire-App
          path: app/build/outputs/apk/debug/*.apk
