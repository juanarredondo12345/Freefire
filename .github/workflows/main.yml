name: Android CI Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download and Setup Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export GRADLE_HOME=$PWD/gradle-8.0
          export PATH=$GRADLE_HOME/bin:$PATH
          
      - name: Make gradlew executable (if exists)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          
      - name: Build Project
        run: |
          # Intenta usar gradlew si existe, si no, usa el comando gradle global
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
