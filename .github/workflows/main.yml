name: Android Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export PATH=$PWD/gradle-8.0/bin:$PATH
          
      - name: Build and Save Error Log
        run: |
          gradle assembleDebug --stacktrace > build_log.txt 2>&1 || true
          
      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build_log.txt
