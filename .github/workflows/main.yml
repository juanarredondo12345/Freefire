name: Android Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Verify and Fix Permissions
        run: |
          ls -l gradlew
          chmod +x gradlew
          chmod +x ./gradlew
          
      - name: Build with Gradle
        run: ./gradlew assembleDebug --info
