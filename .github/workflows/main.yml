name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Make Gradle executable
        run: chmod +x gradlew
        
      - name: Build and Log Errors
        run: |
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1 || true
          
      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build_log.txt
