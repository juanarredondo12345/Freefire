android {
    namespace "com.tu.nombre.app" // <--- CAMBIA ESTO POR TU ID REAL
    
    compileSdk 34

    defaultConfig {
        applicationId "com.tu.nombre.app" // <--- CAMBIA ESTO TAMBIÉN
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
       
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Tus dependencias van aquí abajo
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ... otras librerías ...
}
